# Lokální PostgreSQL + Spring Boot API.
#
# "docker compose up" -> obě služby běží bez mountování hostitelských cest
# (akceptační kritérium PLAN_P1_SPRING_SLICE.md sekce 8). Služba "api" se
# staví přímo z backend/Dockerfile (multi-stage - viz ten soubor); "db" je
# beze změny od kroku 1.
#
# Klíč "version:" se dneska neuvádí - Compose V2 ho ignoruje a varuje.

services:
  db:
    image: postgres:17-alpine
    container_name: gamehelper-db
    environment:
      POSTGRES_DB: gamehelper
      POSTGRES_USER: gamehelper
      POSTGRES_PASSWORD: gamehelper
    ports:
      # Mapování na hostitele, aby se šlo připojit z IntelliJ (Database tool
      # window) a aby aplikace běžící mimo Docker viděla databázi na localhostu.
      - "5432:5432"
    volumes:
      # Pojmenovaný volume: data přežijí "docker compose down".
      # Zahodit je (a nechat migrace proběhnout od nuly) jde přes:
      #     docker compose down -v
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Kontejner hlásí "started" hned, jak se spustí proces - ale Postgres
      # v tu chvíli ještě nepřijímá spojení. Bez healthchecku by služba "api"
      # startovala dřív než databáze a padala na connection refused.
      # depends_on: condition: service_healthy (viz níž) se opírá právě o tohle.
      test: [ "CMD-SHELL", "pg_isready -U gamehelper -d gamehelper" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Krok 7 - staví se přímo z backend/Dockerfile (kontext "." = backend/,
    # protože docker-compose.yml je v backend/). Viz Dockerfile pro detail
    # multi-stage buildu, včetně zdůvodnění -DskipTests a ne-root uživatele.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamehelper-api
    depends_on:
      db:
        # NE jen výchozí "service_started" - bez tohohle by api mohlo
        # naběhnout dřív, než Postgres skutečně přijímá spojení, a spadnout
        # na connection refused (Flyway migrace běží automaticky při startu
        # Spring kontextu, viz backend/README.md). "service_healthy" čeká na
        # healthcheck výš.
        condition: service_healthy
    environment:
      # Přebíjí "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gamehelper}"
      # default v application.yml (ten default je pro spouštění MIMO Docker -
      # mvnw spring-boot:run z IntelliJ proti "db" mapované na localhost:5432
      # výš). Uvnitř Compose sítě "localhost" v kontejneru api NEUKAZUJE na
      # kontejner db - "db" je jméno služby, Compose ho řeší jako DNS jméno
      # v interní síti, kterou si Compose sám vytváří.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gamehelper
      SPRING_DATASOURCE_USERNAME: gamehelper
      SPRING_DATASOURCE_PASSWORD: gamehelper
    ports:
      - "8080:8080"

volumes:
  pgdata:
